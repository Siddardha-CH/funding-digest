# Save this as .github/workflows/funding_digest.yml in your repo.
# It runs funding_digest.py every day for free using GitHub Actions.
#
# Before this works:
# 1. Push funding_digest.py to a (private, recommended) GitHub repo.
# 2. In the repo: Settings > Secrets and variables > Actions > New repository secret.
#    Add: GMAIL_ADDRESS, GMAIL_APP_PASSWORD, TO_EMAIL
# 3. Commit this file, then check the "Actions" tab to confirm it runs.

name: Daily Funding Digest

on:
  schedule:
    - cron: "30 2 * * *"    # 2:30 UTC = 8:00 AM IST (India Standard Time)
  workflow_dispatch:        # lets you trigger it manually to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser openpyxl

      - name: Run digest script
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python funding_digest.py
